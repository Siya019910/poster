<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Willona's Decor & Events Poster</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #FFCBA4;
      color: gold;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 5px;
    }

    .poster {
      width: 100%;
      max-width: 600px;
      padding: 10px;
      text-align: center;
      border-radius: 15px;
      background: url('img.jpeg') no-repeat center center;
      background-size: cover;
      box-shadow: 0 0 20px rgba(255,215,0,0.7);
      color: gold;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .poster::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05));
      z-index: 0;
    }

    .poster > * { position: relative; z-index: 1; }

    .logo {
      width: 150px;
      max-width: 60%;
      margin: 5px auto 5px;
      display: block;
    }

    .slogan {
      font-size: 1.1rem;
      font-weight: bold;
      font-style: italic;
      margin-bottom: 10px;
      text-shadow: 2px 2px 5px #b8860b;
    }

    .services, .contact-info {
      font-style: italic;
      margin: 5px 0;
      font-size: 0.95rem;
      text-shadow: 1px 1px 3px #b8860b;
    }

    .images {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }

    .images img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      transform: rotate(45deg);
      border: 2px solid gold;
      border-radius: 8px;
      box-shadow: 0 0 10px gold, 0 0 15px goldenrod;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .images img:hover {
      transform: rotate(45deg) scale(1.1);
      box-shadow: 0 0 15px gold, 0 0 25px goldenrod;
    }

    .contact-info a {
      display: inline-block;
      margin: 3px 5px;
      color: gold;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 1px 1px 3px #b8860b;
    }

    #qrcode-container {
      margin-top: 15px;
      display: flex;
      justify-content: center;
    }

    #qrcode {
      box-shadow: 0 0 15px gold, 0 0 20px goldenrod;
      padding: 0;
      border-radius: 10px;
      background: transparent;
    }

    .footer {
      margin-top: 10px;
      font-size: 11px;
      opacity: 0.7;
    }

    @media(max-width: 600px) {
      .poster { padding: 8px; }
      .logo { width: 120px; }
      .slogan { font-size: 1rem; margin-bottom: 8px; }
      .services, .contact-info { font-size: 0.85rem; }
      .images img { width: 60px; height: 60px; }
      #qrcode { width: 80px !important; height: 80px !important; }
    }
  </style>
</head>
<body>
  <div class="poster">
    <img src="willona.png" alt="Willona Logo" class="logo" />
    <div class="slogan"><b><i>We don’t just decorate spaces—we design moments that take your breath away.</i></b></div>
    <div class="services">Services: Lobola, Wedding, Birthdays, Graduations, Funerals (prices vary)</div>

    <div class="images">
      <img src="img1.jpg" alt="Decor Image 1">
      <img src="img2.jpg" alt="Decor Image 2">
      <img src="img3.jpg" alt="Decor Image 3">
      <img src="img4.jpg" alt="Decor Image 4">
    </div>

    <div class="contact-info">
      <p><i class="fas fa-map-marker-alt"></i> 530 Buthelezi Street, Twala Section, Katlehong, 1431</p>
      <p><a href="https://wa.me/27685546465" target="_blank"><i class="fab fa-whatsapp"></i> 0685546465</a></p>
      <p><a href="mailto:Mimi.Makhubo605@gmail.com"><i class="fas fa-envelope"></i> Mimi.Makhubo605@gmail.com</a></p>
    </div>

    <div id="qrcode-container">
      <div id="qrcode"></div>
    </div>

    <div class="footer">© 2025 Willona’s Decor & Events | All Rights Reserved.</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://siya019910.github.io/Willlona-s-Decor-Events/",
      width: 80,
      height: 80,
      colorDark : "#000000",
      colorLight : "transparent",
      correctLevel : QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
